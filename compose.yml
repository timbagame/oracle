services:
  oracle:
    image: ghcr.io/timbagame/oracle:main
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      SOLANA_NETWORK: ${SOLANA_NETWORK}
      ORACLE_PORT: "3001"
      ORACLE_API_TOKEN_FILE: /run/secrets/oracle_api_token
    volumes:
      # Read-only keypair; required for on-chain actions
      - ./admin-keypair.json:/app/admin-keypair.json:ro,Z
      - ./secrets/oracle-api-token:/run/secrets/oracle_api_token:ro,Z
      # Persist the sqlite database between restarts
      - ./oracle.sqlite:/app/oracle.sqlite:Z
    networks:
      - timba
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - const response = await fetch('http://127.0.0.1:3001/health'); if (!response.ok) process.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  timba:
    name: timba
    external: true
