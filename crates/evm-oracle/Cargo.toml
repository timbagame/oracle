[package]
name = "timba-evm-oracle"
description = "Opt-in EVM oracle for Timba deployments"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "timba-evm-oracle"
path = "src/main.rs"

[dependencies]
timba-common.workspace = true
alloy-consensus = { version = "1", default-features = false, features = ["std", "k256"] }
alloy-eips = { version = "1", default-features = false, features = ["std"] }
alloy-primitives = { version = "1", features = ["k256"] }
alloy-signer = "1"
alloy-signer-local = "1"
alloy-sol-types = { version = "1", features = ["json"] }
anyhow.workspace = true
axum.workspace = true
futures.workspace = true
hex.workspace = true
rand.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
tempfile = "3"
tower = { workspace = true, features = ["util"] }
