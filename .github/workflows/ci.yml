name: Validate and publish

on:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_LLVM_COV_VERSION: "0.9.1"
  CARGO_AUDIT_VERSION: "0.22.2"
  MIN_LINE_COVERAGE: "90"
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reviewed:
    name: Verify tested source tree
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      tested: ${{ steps.proof.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test proof verification and fallback
        run: python3 scripts/test-reviewed-pr.py
      - name: Verify main matches successful PR CI
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] &&
            scripts/reviewed-pr.sh "$GITHUB_SHA" ci.yml; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "tested=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: reviewed
    if: ${{ !cancelled() && needs.reviewed.outputs.tested != 'true' }}
    name: Validate
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy,llvm-tools-preview
          rustup default "$RUST_TOOLCHAIN"
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Install Cargo tools
        run: |
          cargo install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV_VERSION"
          cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
      - name: Audit dependencies
        run: cargo audit
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests with coverage
        id: tests
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --locked --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --summary-only --fail-under-lines "$MIN_LINE_COVERAGE"
      - name: Upload coverage
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      - name: Build OCI image
        run: |
          command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install --yes podman; }
          podman build --build-arg VCS_REF="${GITHUB_SHA}" --format oci --file Containerfile --tag oracle:ci .
          podman run --rm oracle:ci timba-oracle --version
          podman run --rm oracle:ci test -x /usr/local/bin/timba-evm-oracle

      - name: Record the tree that passed validation
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p tested-source-tree
          git rev-parse 'HEAD^{tree}' > tested-source-tree/tree
      - name: Upload tested source tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-source-tree
          path: tested-source-tree/tree
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish OCI image
    if: >-
      !cancelled() && needs.reviewed.result == 'success' && github.event_name != 'pull_request' &&
      (needs.validate.result == 'success' || (needs.reviewed.outputs.tested == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'skipped'))
    needs: [reviewed, validate]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Select image tag
        shell: bash
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="main"
          fi
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"
          echo "IMAGE_TAG=${image}:${tag}" >> "${GITHUB_ENV}"

      - name: Log into registry
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${HOME}/.docker"
          printf '%s' "${REGISTRY_TOKEN}" | podman login --authfile "${HOME}/.docker/config.json" "${REGISTRY}" --username "${GITHUB_ACTOR}" --password-stdin
          echo "REGISTRY_AUTH_FILE=${HOME}/.docker/config.json" >> "${GITHUB_ENV}"

      - name: Build OCI image
        run: podman build --build-arg VCS_REF="${GITHUB_SHA}" --platform linux/amd64 --format oci --file Containerfile --tag "${IMAGE_TAG}" .

      - name: Push OCI image
        run: podman push --digestfile /tmp/image-digest "${IMAGE_TAG}"

      - name: Sign published image
        env:
          COSIGN_YES: "true"
        shell: bash
        run: |
          image_ref="${IMAGE}@$(cat /tmp/image-digest)"
          for attempt in 1 2 3 4 5; do
            if cosign sign "${image_ref}"; then
              exit 0
            fi
            if [[ "${attempt}" == "5" ]]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
