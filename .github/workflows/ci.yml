name: Validate and publish

on:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.1
      - name: Restore Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-install-${{ runner.os }}-
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun audit
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun x tsc -p tsconfig.json --noEmit
      - name: Tests
        run: bun test --no-summarize

  integration:
    name: Validator integration
    needs: validate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
      packages: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: workspace/oracle
          persist-credentials: false
      - name: Select integration scope
        id: scope
        shell: bash
        working-directory: workspace/oracle
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [[ "$EVENT" == pull_request ]]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > "$RUNNER_TEMP/integration-paths"
            grep -Ev '(^|/)(README[^/]*|[^/]+\.md)$|^\.(gitignore|prettierignore)$' "$RUNNER_TEMP/integration-paths" > "$RUNNER_TEMP/runtime-paths" || [[ $? == 1 ]]
            if [[ ! -s "$RUNNER_TEMP/runtime-paths" ]]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Checkout integration runner
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: timbagame/operations
          ref: 8e355a25d27081eb45a4d04444f413913e0b32e1
          path: workspace/operations
          token: ${{ secrets.INTEGRATION_READ_TOKEN }}
          persist-credentials: false
      - uses: ./workspace/operations/.github/actions/integration
        if: steps.scope.outputs.run == 'true'
        with:
          candidate: oracle
          read-token: ${{ secrets.INTEGRATION_READ_TOKEN }}
          web: "false"

  publish:
    name: Publish OCI image
    if: github.event_name != 'pull_request'
    needs: [validate, integration]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Select image tag
        shell: bash
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="main"
          fi
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"
          echo "IMAGE_TAG=${image}:${tag}" >> "${GITHUB_ENV}"

      - name: Log into registry
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${HOME}/.docker"
          printf '%s' "${REGISTRY_TOKEN}" | podman login --authfile "${HOME}/.docker/config.json" "${REGISTRY}" --username "${GITHUB_ACTOR}" --password-stdin
          echo "REGISTRY_AUTH_FILE=${HOME}/.docker/config.json" >> "${GITHUB_ENV}"

      - name: Download validated image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: validated-image
          path: validated-image

      - name: Load and tag the tested artifact
        shell: bash
        run: |
          test "$(jq -r .revision validated-image/candidate-image.json)" = "$GITHUB_SHA"
          podman load --input validated-image/candidate-image.oci
          image_id="$(jq -r .image validated-image/candidate-image.json)"
          test "$(podman image inspect "$image_id" --format '{{index .Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          podman tag "$image_id" "$IMAGE_TAG"

      - name: Push OCI image
        run: podman push --digestfile /tmp/image-digest "${IMAGE_TAG}"

      - name: Sign published image
        env:
          COSIGN_YES: "true"
        shell: bash
        run: |
          image_ref="${IMAGE}@$(cat /tmp/image-digest)"
          for attempt in 1 2 3 4 5; do
            if cosign sign "${image_ref}"; then
              exit 0
            fi
            if [[ "${attempt}" == "5" ]]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
