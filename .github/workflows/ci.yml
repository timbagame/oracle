name: Oracle CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  oracle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun x tsc -p tsconfig.json --noEmit
      - name: Tests
        run: bun test --no-summarize
