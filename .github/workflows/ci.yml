name: Validate and publish

on:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Restore Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-install-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun x tsc -p tsconfig.json --noEmit
      - name: Tests
        run: bun test --no-summarize

  publish:
    name: Publish OCI image
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Select image tag
        shell: bash
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="main"
          fi
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"
          echo "IMAGE_TAG=${image}:${tag}" >> "${GITHUB_ENV}"

      - name: Log into registry
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${HOME}/.docker"
          printf '%s' "${REGISTRY_TOKEN}" | podman login --authfile "${HOME}/.docker/config.json" "${REGISTRY}" --username "${GITHUB_ACTOR}" --password-stdin
          echo "REGISTRY_AUTH_FILE=${HOME}/.docker/config.json" >> "${GITHUB_ENV}"

      - name: Build OCI image
        run: podman build --platform linux/amd64 --format oci --file Containerfile --tag "${IMAGE_TAG}" .

      - name: Push OCI image
        run: podman push --digestfile /tmp/image-digest "${IMAGE_TAG}"

      - name: Sign published image
        env:
          COSIGN_YES: "true"
        run: cosign sign "${IMAGE}@$(cat /tmp/image-digest)"
