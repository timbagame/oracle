name: Validate and publish

on:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reviewed:
    name: Verify tested source tree
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      tested: ${{ steps.proof.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test proof verification and fallback
        run: python3 scripts/test-reviewed-pr.py
      - name: Verify main matches successful PR CI
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] &&
            scripts/reviewed-pr.sh "$GITHUB_SHA" ci.yml; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "tested=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: reviewed
    if: ${{ !cancelled() && needs.reviewed.outputs.tested != 'true' }}
    name: Validate
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        # Installs the channel and components pinned in rust-toolchain.toml.
        run: rustup toolchain install
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Install Cargo tools
        # Installs the versions pinned in mise.toml, and caches them.
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Audit dependencies
        run: cargo audit
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests with coverage
        id: tests
        run: |
          python3 scripts/test-check-coverage.py
          mkdir -p coverage
          cargo llvm-cov --workspace --locked --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --summary-only
          python3 scripts/check-coverage.py coverage/lcov.info coverage-scope.json
      - name: Upload coverage
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      - name: Build OCI image
        run: |
          command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install --yes podman; }
          podman build --build-arg VCS_REF="${GITHUB_SHA}" --format oci --file Containerfile --tag oracle:ci .
          scripts/smoke-image.sh oracle:ci

      - name: Record the tree that passed validation
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p tested-source-tree
          git rev-parse 'HEAD^{tree}' > tested-source-tree/tree
      - name: Upload tested source tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-source-tree
          path: tested-source-tree/tree
          if-no-files-found: error
          retention-days: 90

  branch-coverage:
    # Informational: branch coverage needs a nightly compiler, so it cannot gate.
    needs: reviewed
    if: ${{ !cancelled() && needs.reviewed.outputs.tested != 'true' }}
    name: Branch coverage (nightly, informational)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    continue-on-error: true
    env:
      NIGHTLY: nightly-2026-10-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly toolchain
        run: rustup toolchain install "$NIGHTLY" --profile minimal --component llvm-tools-preview
      - name: Install cargo-llvm-cov
        # The version pinned in mise.toml, built with the nightly toolchain.
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: cargo:cargo-llvm-cov
          cache_key_prefix: mise-nightly
        env:
          RUSTUP_TOOLCHAIN: ${{ env.NIGHTLY }}
      - name: Branch coverage
        run: |
          mkdir -p coverage
          cargo +"$NIGHTLY" llvm-cov --branch --workspace --locked --lcov --output-path coverage/branch-lcov.info
          cargo +"$NIGHTLY" llvm-cov report --branch --summary-only
      - name: Upload branch coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: branch-coverage
          path: coverage/
          if-no-files-found: ignore

  required-ci:
    name: CI / Required
    # Always report a result, including when a prerequisite failed or was skipped.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - reviewed
      - validate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every PR validation job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'length == 2 and all(. == "success")' <<< "$RESULTS"

  publish:
    name: Publish OCI image
    if: >-
      !cancelled() && needs.reviewed.result == 'success' && github.event_name != 'pull_request' &&
      (needs.validate.result == 'success' || (needs.reviewed.outputs.tested == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'skipped'))
    needs: [reviewed, validate]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Select image tag
        shell: bash
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="main"
          fi
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"
          echo "IMAGE_TAG=${image}:${tag}" >> "${GITHUB_ENV}"

      - name: Log into registry
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${HOME}/.docker"
          printf '%s' "${REGISTRY_TOKEN}" | podman login --authfile "${HOME}/.docker/config.json" "${REGISTRY}" --username "${GITHUB_ACTOR}" --password-stdin
          echo "REGISTRY_AUTH_FILE=${HOME}/.docker/config.json" >> "${GITHUB_ENV}"

      - name: Build OCI image
        run: podman build --build-arg VCS_REF="${GITHUB_SHA}" --platform linux/amd64 --format oci --file Containerfile --tag "${IMAGE_TAG}" .

      - name: Push OCI image
        run: podman push --digestfile /tmp/image-digest "${IMAGE_TAG}"

      - name: Sign published image
        env:
          COSIGN_YES: "true"
        shell: bash
        run: |
          image_ref="${IMAGE}@$(cat /tmp/image-digest)"
          for attempt in 1 2 3 4 5; do
            if cosign sign "${image_ref}"; then
              exit 0
            fi
            if [[ "${attempt}" == "5" ]]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
