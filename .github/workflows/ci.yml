name: Validate and publish

on:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reviewed:
    name: Verify tested source tree
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      tested: ${{ steps.proof.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test proof verification and fallback
        run: python3 scripts/test-reviewed-pr.py
      - name: Verify main matches successful PR CI
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] &&
            scripts/reviewed-pr.sh "$GITHUB_SHA" ci.yml; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "tested=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: reviewed
    if: ${{ !cancelled() && needs.reviewed.outputs.tested != 'true' }}
    name: Validate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Restore Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-install-${{ runner.os }}-
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun audit
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun x tsc -p tsconfig.json --noEmit
      - name: Tests
        id: tests
        run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage
      - name: Enforce 100% line coverage
        run: bun run scripts/check-coverage.ts coverage-scope.json coverage/lcov.info
      - name: Upload coverage
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      - name: Record the tree that passed validation
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p tested-source-tree
          git rev-parse 'HEAD^{tree}' > tested-source-tree/tree
      - name: Upload tested source tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-source-tree
          path: tested-source-tree/tree
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish OCI image
    if: >-
      !cancelled() && needs.reviewed.result == 'success' && github.event_name != 'pull_request' &&
      (needs.validate.result == 'success' || (needs.reviewed.outputs.tested == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'skipped'))
    needs: [reviewed, validate]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Select image tag
        shell: bash
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="main"
          fi
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"
          echo "IMAGE_TAG=${image}:${tag}" >> "${GITHUB_ENV}"

      - name: Log into registry
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${HOME}/.docker"
          printf '%s' "${REGISTRY_TOKEN}" | podman login --authfile "${HOME}/.docker/config.json" "${REGISTRY}" --username "${GITHUB_ACTOR}" --password-stdin
          echo "REGISTRY_AUTH_FILE=${HOME}/.docker/config.json" >> "${GITHUB_ENV}"

      - name: Build OCI image
        env:
          PACKAGE_TOKEN: ${{ github.token }}
        run: podman build --build-arg VCS_REF="${GITHUB_SHA}" --secret=id=npm_token,env=PACKAGE_TOKEN --platform linux/amd64 --format oci --file Containerfile --tag "${IMAGE_TAG}" .

      - name: Push OCI image
        run: podman push --digestfile /tmp/image-digest "${IMAGE_TAG}"

      - name: Sign published image
        env:
          COSIGN_YES: "true"
        shell: bash
        run: |
          image_ref="${IMAGE}@$(cat /tmp/image-digest)"
          for attempt in 1 2 3 4 5; do
            if cosign sign "${image_ref}"; then
              exit 0
            fi
            if [[ "${attempt}" == "5" ]]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
